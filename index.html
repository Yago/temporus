<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>temporus</title>
    <link href="/src/styles/base.css" rel="stylesheet">
  </head>
  <body
    class="font-mono antialiased bg-black text-neutral-100 text-base"
    x-data="{
      lng: 'fr',
      get currentItem() { return $store.timeline.currentItem },
    }"
    x-init="
      $store.timeline.create();
      $store.utils.setLng(lng);
    "
    x-effect="
      $store.timeline.destroy();
      $store.timeline.create();
      $store.utils.setLng(lng);
    "
  >
    <div
      id="visualization"
      class="h-screen w-[calc(100vw-450px)] min-w-[75vw]"
    ></div>

    <div class="fixed right-0 inset-y-0 w-[450px] max-w-[25vw] overflow-y-auto shadow-[-10px_0_50px_-2px_rgba(0,0,0,0.8)]">
      <div class="p-5 flex flex-col h-full">
        <h1
          class="text-2xl font-bold"
          x-show="currentItem?.content"
          x-text="`${currentItem?.content}`"
        ></h1>
        <div
          x-show="currentItem?.properties?.description"
          class="text-neutral-200 mt-3"
          x-html="currentItem?.properties?.description"
        ></div>
        <a
          x-show="currentItem?.properties?.wikiUrl"
          :href="currentItem?.properties?.wikiUrl"
          class="inline-block mt-3"
          target="_blank"
        >
          Wikipedia
          <svg class="icon text-xs">
            <use href="/public/icons.svg?v1#external"></use>
          </svg>
        </a>

        <div
          x-show="currentItem?.properties?.credits"
          class="text-neutral-500 pt-3 mt-auto text-sm"
        >
          <a :href="currentItem?.properties?.credits?.url" target="_blank">
            <span class="text-base">©</span>
            <span x-text="currentItem?.properties?.credits?.attribution"></span>
            <svg class="icon text-xs">
              <use href="/public/icons.svg?v1#external"></use>
            </svg>
          </a>
        </div>
        
        <pre id="debug" class="hidden" x-text="JSON.stringify(currentItem, null, 2)"></pre>
      </div>
    </div>


    <button
      @click="$store.timeline.goTo(-200, 200)"
      class="fixed top-4 right-4 z-10 bg-amber-300 rounded-sm p-3 text-black hidden"
    >
      Go to today
    </button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
