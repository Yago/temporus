<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>temporus</title>
    <link href="/src/styles/base.css" rel="stylesheet" />
  </head>
  <body
    class="font-mono antialiased bg-black text-neutral-100 text-base"
    x-data="{
      get currentItem() { return $store.timeline.currentItem },
      mobile: window.innerWidth < 1024,
    }"
    x-init="
      $store.timeline.create();
      if ($store.utils.getLng() === null) $store.utils.setLng('fr');
      window.addEventListener('resize', () => mobile = window.innerWidth < 1024)
    "
  >
    <!-- Timeline -->
    <div
      class="relative h-screen w-full lg:w-[calc(100vw-450px)] lg:min-w-[75vw]"
    >
      <div
        id="visualization"
        class="h-screen w-full lg:w-[calc(100vw-450px)] lg:min-w-[75vw]"
      ></div>

      <button
        class="absolute bottom-9 right-3 size-6 border border-neutral-200 rounded-full lg:z-10 text-sm font-bold cursor-pointer bg-black hover:bg-neutral-800 transition-all opacity-0"
        :class="currentItem !== null && 'opacity-100'"
        @click="$store.timeline.currentItem = null"
      >?</button>
    </div>

    <!-- Sidebar -->
    <div
      class="fixed right-2 lg:right-0 bottom-0 max-lg:h-[92svh] lg:inset-y-0 w-[calc(100%-16px)] md:w-[350px] lg:w-[450px] lg:max-w-[25vw] bg-black shadow-[-10px_0_50px_-2px_rgba(0,0,0,0.8)] border-l max-lg:border-x border-neutral-800 transition-transform duration-500 max-lg:rounded-t-lg"
      :class="!$store.timeline.sidebarOpen && mobile && 'translate-y-[calc(100%-70px)]'"
    >
      <div class="grid grid-rows-[auto_1fr] h-full">
        <!-- Options bar -->
        <div class="flex border-y border-neutral-800 items-center controls max-lg:rounded-t-lg">
          <button @click="$store.timeline.move(0.9)">
            <svg class="icon size-4">
              <use href="/public/icons.svg?v1#chevron-left"></use>
            </svg>
          </button>
          <button @click="$store.timeline.move(-0.9)">
            <svg class="icon size-4">
              <use href="/public/icons.svg?v1#chevron-right"></use>
            </svg>
          </button>
          <button @click="$store.timeline.zoomOut(1)">
            <svg class="icon size-4">
              <use href="/public/icons.svg?v1#zoom-out"></use>
            </svg>
          </button>
          <button @click="$store.timeline.zoomIn(1)">
            <svg class="icon size-4">
              <use href="/public/icons.svg?v1#zoom-in"></use>
            </svg>
          </button>
          <select
            x-ref="scales"
            @input="$store.timeline.goToScale($event.target.value);setTimeout(() => $refs.scales.value = null, 0);$event.target.blur();"
            class="bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiNmZmYiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIiBjbGFzcz0ibHVjaWRlIGx1Y2lkZS1ydWxlci1kaW1lbnNpb24tbGluZS1pY29uIGx1Y2lkZS1ydWxlci1kaW1lbnNpb24tbGluZSI+PHBhdGggZD0iTTEyIDE1di0zLjAxNCIvPjxwYXRoIGQ9Ik0xNiAxNXYtMy4wMTQiLz48cGF0aCBkPSJNMjAgNkg0Ii8+PHBhdGggZD0iTTIwIDhWNCIvPjxwYXRoIGQ9Ik00IDhWNCIvPjxwYXRoIGQ9Ik04IDE1di0zLjAxNCIvPjxyZWN0IHg9IjMiIHk9IjEyIiB3aWR0aD0iMTgiIGhlaWdodD0iNyIgcng9IjEiLz48L3N2Zz4=')]"
            :title="$store.utils.t('settings.scales')"
          >
            <option
              value=""
              disabled
              selected
              x-text="$store.utils.t('ui.select')"
            ></option>
            <template x-for="scale in Object.keys(settings.scales)">
              <option
                :value="scale"
                x-text="$store.utils.t(`scales.${scale}`)"
              ></option>
            </template>
          </select>
          <button
            class="size-6 hover:bg-neutral-200 rounded-sm cursor-pointer"
            @click="$store.timeline.launchFullscreen(); $store.timeline.fullscreen = true;"
            x-show="!$store.timeline.fullscreen"
            x-cloak
          >
            <svg class="icon size-4">
              <use href="/public/icons.svg?v1#fullscreen-in"></use>
            </svg>
          </button>
          <button
            class="size-6 hover:bg-neutral-200 rounded-sm cursor-pointer"
            @click="$store.timeline.exitFullscreen(); $store.timeline.fullscreen = false;"
            x-show="$store.timeline.fullscreen"
            x-cloak
          >
            <svg class="icon size-4">
              <use href="/public/icons.svg?v1#fullscreen-out"></use>
            </svg>
          </button>
          <select
            @input="$store.utils.setLng($event.target.value);"
            :value="$store.utils.getLng()"
            x-ref="languages"
            class="bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiNmZmYiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIiBjbGFzcz0ibHVjaWRlIGx1Y2lkZS1sYW5ndWFnZXMtaWNvbiBsdWNpZGUtbGFuZ3VhZ2VzIj48cGF0aCBkPSJtNSA4IDYgNiIvPjxwYXRoIGQ9Im00IDE0IDYtNiAyLTMiLz48cGF0aCBkPSJNMiA1aDEyIi8+PHBhdGggZD0iTTcgMmgxIi8+PHBhdGggZD0ibTIyIDIyLTUtMTAtNSAxMCIvPjxwYXRoIGQ9Ik0xNCAxOGg2Ii8+PC9zdmc+')] border-r-0!"
            :title="$store.utils.t('settings.languages')"
          >
            <template x-for="lngKey in Object.keys(settings.languages)">
              <option
                :value="lngKey"
                x-text="settings.languages[lngKey]"
                :selected="lngKey === $store.utils.getLng()"
              ></option>
            </template>
          </select>
        </div>

        <!-- Content -->
        <div class="h-full overflow-y-auto">
          <div class="p-4! lg:p-5! flex flex-col">
            <h1
              class="text-lg lg:text-2xl font-bold"
              x-html="currentItem?.content ?? $store.utils.t('intro.title')"
            ></h1>

            <h2
              class="text-sm"
              x-show="currentItem?.start && currentItem?.end"
              x-cloak
              x-text="`${$store.utils.formatNumber(currentItem?.start)} ${$store.utils.t('ui.to')} ${$store.utils.formatNumber(currentItem?.end)}`"
            ></h2>

            <img
              :src="currentItem?.properties?.cover"
              :alt="currentItem?.content ?? $store.utils.t('intro.title')"
              class="my-4 grayscale rounded"
              x-show="currentItem?.properties?.cover"
              x-cloak
            />

            <div
              class="max-lg:text-sm text-neutral-200 mt-3 content"
              x-html="currentItem?.properties?.description ?? $store.utils.t('intro.description')"
            ></div>

            <a
              x-show="currentItem?.properties?.wikiUrl"
              x-cloak
              :href="currentItem?.properties?.wikiUrl"
              class="inline-block mt-3"
              target="_blank"
            >
              Wikipedia
              <svg class="icon text-xs">
                <use href="/public/icons.svg?v1#external"></use>
              </svg>
            </a>

            <div
              x-show="currentItem?.properties?.credits"
              x-cloak
              class="text-neutral-500 pt-3 mt-auto text-sm"
            >
              <a :href="currentItem?.properties?.credits?.url" target="_blank">
                <span class="text-base">©</span>
                <span
                  x-text="currentItem?.properties?.credits?.attribution"
                ></span>
                <svg class="icon text-xs">
                  <use href="/public/icons.svg?v1#external"></use>
                </svg>
              </a>
            </div>

            <pre
              id="debug"
              class="hidden"
              x-text="JSON.stringify(currentItem, null, 2)"
            ></pre>
          </div>
        </div>
      </div>

      <button
        class="absolute -top-6 left-1/2 -translate-x-1/2 w-12 h-6 bg-neutral-200 text-black rounded-t-full"
        @click="$store.timeline.toggleSidebar()"
      >
        <svg
          class="icon top-0 size-5"
          :class="$store.timeline.sidebarOpen && 'rotate-180'"
        >
          <use href="/public/icons.svg?v1#chevron-up"></use>
        </svg>
      </button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
