<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>temporus</title>
    <link href="/src/styles/base.css" rel="stylesheet" />

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Temporus" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="description" content="temporus is an open-source tool for visualizing historical and geological events at different time scales to appreciate the complexity and evolution of the Earth and humanity (also short as it is in comparison).">
    <meta name="keywords" content="temporus, timeline, history, geology, science, open-source, visualizer">
    <meta property="og:image" content="https://temporus.app/og-image.jpg">
    <meta property="og:title" content="temporus">
    <meta property="og:description" content="temporus is an open-source tool for visualizing historical and geological events at different time scales to appreciate the complexity and evolution of the Earth and humanity (also short as it is in comparison).">
    <meta property="og:url" content="https://temporus.app">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">
    <meta property="og:site_name" content="temporus">
  </head>
  <body
    class="font-mono antialiased bg-black text-neutral-100 text-base"
    x-data="{
      get currentItem() { return $store.timeline.currentItem },
      mobile: window.innerWidth < 1024,
    }"
    x-init="
      $store.timeline.create();
      if ($store.utils.getLng() === null) $store.utils.setLng('fr');
      window.addEventListener('resize', () => mobile = window.innerWidth < 1024)
    "
  >
    <!-- Timeline -->
    <include src="components/timeline.html"></include>

    <!-- Sidebar -->
    <div
      class="fixed right-2 lg:right-0 bottom-0 max-lg:h-[92svh] lg:inset-y-0 w-[calc(100%-16px)] md:w-[400px] lg:w-[450px] lg:max-w-[30vw] bg-black shadow-[-10px_0_50px_-2px_rgba(0,0,0,0.8)] border-l max-lg:border-x border-neutral-800 transition-transform duration-500 max-lg:rounded-t-lg"
      :class="!$store.timeline.sidebarOpen && mobile && 'translate-y-[calc(100%-50px)]'"
    >
      <div class="grid grid-rows-[auto_1fr] h-full">
        <!-- Options bar -->
        <include src="components/controls.html"></include>

        <!-- Content -->
        <div class="h-full overflow-y-auto" x-show="!$store.timeline.searchOpen && !$store.timeline.settingsOpen">
          <include src="components/content.html"></include>
        </div>

        <!-- Search -->
        <div class="h-full overflow-y-auto" x-show="$store.timeline.searchOpen" x-cloak>
          <include src="components/search.html"></include>
        </div>

        <!-- Settings -->
        <div class="h-full overflow-y-auto" x-show="$store.timeline.settingsOpen" x-cloak>
          <include src="components/settings.html"></include>
        </div>
      </div>

      <include src="components/sidebar-toggle.html"></include>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
