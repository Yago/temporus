
<div class="p-4! lg:p-5! flex flex-col">
  <h1
    class="text-lg lg:text-2xl font-bold"
    x-html="currentItem?.content ?? $store.utils.t('intro.title')"
  ></h1>

  <h2
    class="text-sm"
    x-show="currentItem?.start && currentItem?.end"
    x-cloak
    x-text="`${$store.utils.formatNumber(currentItem?.start)} ${$store.utils.t('ui.to')} ${$store.utils.formatNumber(currentItem?.end)}`"
  ></h2>

  <h2
    class="text-sm"
    x-show="currentItem?.start && !currentItem?.end"
    x-cloak
    x-text="`${$store.utils.formatNumber(currentItem?.start)}`"
  ></h2>

  <img
    :src="currentItem?.properties?.cover"
    :alt="currentItem?.content ?? $store.utils.t('intro.title')"
    class="my-4 grayscale rounded"
    x-show="currentItem?.properties?.cover"
    x-cloak
  />

  <div
    class="max-lg:text-sm text-neutral-200 mt-3 content"
    x-html="currentItem !== null ? currentItem?.properties?.description ?? '' : $store.utils.t('intro.description')"
  ></div>

  <div x-show="currentItem === null" x-cloak class="content">
    <table>
      <tr>
        <th x-text="$store.utils.t('intro.commands')[0].icon"></th>
        <th x-text="$store.utils.t('intro.commands')[0].action" class="text-left!"></th>
        <th x-text="$store.utils.t('intro.commands')[0].keyboard"></th>
        <th x-text="$store.utils.t('intro.commands')[0].mouse"></th>
      </tr>
      <template x-for="command in $store.utils.t('intro.commands').slice(1)">
        <tr>
          <td>
            <svg class="icon">
              <use :href="`/public/icons.svg?v1#${command.icon}`"></use>
            </svg>
          </td>
          <td x-text="command.action" class="text-left!"></td>
          <td x-text="command.keyboard"></td>
          <td x-text="command.mouse"></td>
        </tr>
      </template>
    </table>

    <div class="flex items-end gap-2 mt-4">
      <svg class="icon size-3 translate-y-1">
        <use href="/public/icons.svg?v1#github"></use>
      </svg>
      <a href="https://github.com/Yago/temporus" target="_blank" class="text-sm">
        <span x-text="$store.utils.t('intro.contribute')"></span>
      </a>
    </div>
  </div>

  <a
    x-show="currentItem?.properties?.wikiUrl"
    x-cloak
    :href="currentItem?.properties?.wikiUrl"
    class="inline-block mt-3"
    target="_blank"
  >
    Wikipedia
    <svg class="icon text-xs">
      <use href="/public/icons.svg?v1#external"></use>
    </svg>
  </a>

  <div
    x-show="currentItem?.properties?.credits?.url && currentItem?.properties?.credits?.attribution"
    x-cloak
    class="text-neutral-500 pt-3 mt-auto text-sm"
  >
    <a :href="currentItem?.properties?.credits?.url" target="_blank">
      <span class="text-base">©</span>
      <span
        x-text="currentItem?.properties?.credits?.attribution"
      ></span>
      <svg class="icon text-xs">
        <use href="/public/icons.svg?v1#external"></use>
      </svg>
    </a>
  </div>
</div>
